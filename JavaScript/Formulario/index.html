<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container-fluid px-5 my-5">
      <div class="row">
        <div class="col-md-4 ">
          <div class="card bg-white">
            <div class="card-body">
              <div class="mt-3">
                <label for="">Nombre</label>
                <input
                  type="text"
                  id="txt_name"
                  class="form-control bg-light"
                  placeholder="Nombre"
                />
              </div>
              <div class="mt-3">
                <label for="">Apellido</label>
                <input
                  type="text"
                  id="txt_last_name"
                  class="form-control bg-light"
                  x
                  placeholder="Apellido"
                />
              </div>
              <div class="mt-3">
                <label for="">Correo</label>
                <input
                  type="email"
                  id="email"
                  class="form-control bg-light"
                  placeholder="Correo"
                />
              </div>
              <div class="mt-3">
                <button type="button" class="btn btn-primary w-100" id="btn">
                  Agregar
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Nombres</th>
                <th scope="col">Apellidos</th>
                <th scope="col">Correo</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- DATOS TABLA-->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MODAL -->

    <div
      class="modal fade"
      id="miModal"
      tabindex="-1"
      aria-labelledby="miModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="miModalLabel">Modal</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="modal_id" />

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="modal_name" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" id="modal_lastname" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" id="modal_email" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>

            <!-- este botón solo se usa al EDITAR -->
            <button type="button" class="btn btn-primary" id="btnModalSave">
              Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./script.js"></script>
  </body>
</html>
