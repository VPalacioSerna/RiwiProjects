<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--Link para bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!--Link para los iconos de bootstrap-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!--Link de css-->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container ">
    <span class="navbar-brand fw-bold">CuriosiWeb Admin</span>

    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="../dashboard/dash.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link active fw-bold" href="#">Products</a></li>
    </ul>
  </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
  <h2 class="fw-bold mb-4 ms-3">Add New Product</h2>
  <div class="row">

    <!-- FORM -->
    <div class="col-lg-8">

      

      <form id="productForm">

        <!-- BASIC INFO -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Basic Information</h5>

            <div class="mb-3">
              <label class="form-label" id="productName">Product Name</label>
              <input type="text" class="form-control">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" id="productCategory">Category</label>
                <select class="form-select">
                  <option>men's Gear</option>
                  <option>women's Gear</option>
                  <option>Accessories</option>
                </select>
              </div>

            </div>

            <div class="mb-3">
              <label class="form-label" id="productDescription">Product Description</label>
              <textarea class="form-control" rows="4"></textarea>
            </div>
          </div>
        </div>

        <!-- PRICING -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Pricing details</h5>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" id="productPrice">Price ($)</label>
                <input type="number" class="form-control">
              </div>

              <div class="col-md-6 mb-3">
            
              </div>
            </div>
          </div>
        </div>

        <!-- IMAGES -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="fw-bold mb-3" id="productImage">Product Images</h5>

            <input type="file" class="form-control">
          </div>
        </div>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-end gap-2 mb-5">
          <button type="reset" class="btn btn-outline-secondary">Discard</button>
          <button type="submit" class="btn btn-success" id="sumbitBtn">Save Product</button>
        </div>

      </form>
    </div>

    <!-- PREVIEW -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-body text-center">
          <span class="badge bg-success mb-2">PREVIEW</span>

          <img src="assets/racket.png" class="img-fluid mb-3" style="max-height:200px">

          <h5 class="fw-bold">--</h5>
          <p class="text-success fw-bold fs-5">$269.00</p>

          <button class="btn btn-dark w-100">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./editar.js"></script>
</body>
</html>
