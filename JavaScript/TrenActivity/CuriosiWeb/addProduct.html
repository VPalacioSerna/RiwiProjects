<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>addProduct</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container-fluid p-4">
      <!-- Navbar Basico -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Add New Product</h3>
        <div>
          <button class="btn btn-outline-secondary me-2 discard">Discard</button>
          <button class="btn btn-success save">Save Product</button>
        </div>
      </div>

      <div class="row g-4">
        <!-- Column Izquierda left -->
        <div class="col-lg-8">
          <!-- Basic Information -->
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title mb-3">Basic Information</h5>

              <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input
                  type="text"
                  class="form-control name"
                  placeholder="Wilson Pro Staff 97 v14"
                />
              </div>

              <div class="row mb-3">
                <!-- <div class="col-md-6">
                  <label class="form-label">Category</label>
                  <select class="form-select">
                    <option selected>Tennis Rackets</option>
                  </select>
                </div> -->
                <div class="col-md-6">
                  <label class="form-label">Brand</label>
                  <input type="text" class="form-control brand" placeholder="Wilson" />
                </div>
              </div>

              <div>
                <label class="form-label">Product Description</label>
                <textarea class="form-control description" rows="4">
The legendary precision of the Pro Staff 97 returns...
            </textarea
                >
              </div>
            </div>
          </div>

          <!-- Preci Stock and View Status -->
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title mb-3">Pricing & Inventory</h5>

              <div class="row">
                <div class="col-md-6">
                  <label class="form-label">Price ($)</label>
                  <input type="text" class="form-control price" placeholder="269.00" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Stock</label>
                  <input type="text" class="form-control stock" placeholder="15" />
                </div>
                <div class="col-md-6 mt-3">
                  <label class="form-label">View Status</label>
                  <select class="form-select status ">
                    <option selected>Visible</option>
                    <option selected>Not Visible</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Images -->
          <div class="card">
            <div class="card-body">
              <h5 class="card-title mb-3">Product Images</h5>

              <div class="d-flex gap-3">
                <div class="border rounded p-2">
                  <img src="racket.png" width="100" />
                </div>
                <div
                  class="border rounded d-flex align-items-center justify-content-center"
                  style="width: 100px; height: 100px"
                >
                  <span class="text-muted">Add Image</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Column Derecha Rigth -->
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body text-center">
              <span class="badge bg-success mb-2">NEW ARRIVAL</span>

              <img
                src="racket.png"
                class="img-fluid my-3"
                style="max-height: 220px"
              />

              <p class="text-muted mb-1">TENNIS RACKETS</p>
              <h5 class="fw-bold">Wilson Pro Staff 97 v14</h5>

              <h4 class="text-success fw-bold">$269.00</h4>

              <button class="btn btn-dark w-100 mt-3">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  <script src="./addProduct.js"></script>
  </body>
</html>
