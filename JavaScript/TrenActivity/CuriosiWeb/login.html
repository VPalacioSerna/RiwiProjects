<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuriosiWeb | Login</title>
    <!--Link para bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Link para los iconos de bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!--Link de css-->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    
    <div class="container">
        <div class="row min-vh-100 d-flex align-items-center">
            <div class="col-12 col-md-6 offset-md-3 col-xl-4 offset-xl-4  ">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">
                        
                        <div class="text-center mb-4 ">
                            <div class="d-flex align-items-center justify-content-center mb-2 py-5 border-bottom bg-light rounded-3">
                                <div class="me-2">
                                    <img src="./img/icons/icon.png" alt="">
                                </div>
                                <span class="fw-bold fs-4">CuriosiWeb</span>
                            </div>
                            <h4 class="fw-bold mt-4">Welcome Back</h4>
                            <p class="text-muted small">Admin Access Only</p>
                        </div>

                        <div class="mt-3">
                            <label class="form-label small fw-bold">Correo</label>
                            <div class="input-group border rounded-3 overflow-hidden">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="inputEmail" class="form-control border-0 shadow-none ps-0" placeholder="admin@curiosiweb.com">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label small fw-bold">Contraseña</label>
                            <div class="input-group border rounded-3 overflow-hidden">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="inputPassword" class="form-control border-0 shadow-none ps-0" placeholder="••••••••">
                                
                                <i class="bi bi-eye btn px-4 m-auto" id="btnVisible"></i>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="button" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm border-0" id="botonInicio" style="background-color: #00ff7f !important; color: #000;">
                                Iniciar sesión
                            </button>                          
                        </div>

                        <div class="mt-3 d-flex justify-content-center">
                            <a href="./landing.html"
                            class="btn btn-outline-success w-50 py-2 fw-bold rounded-3 shadow-sm border-2" id="botonBack">
                                Go back Landing
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./JavaScript/login.js"> </script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
